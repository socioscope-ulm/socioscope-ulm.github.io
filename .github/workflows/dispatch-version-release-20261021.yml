name: One-time autonomous API version release trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-version-release-20261021.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.head_commit.message == 'DECLENCHER_PUBLICATION_AUTONOME_VERSION_API_20261021'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing manual and gated Supabase API deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/deploy-supabase.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$status" != "204" ]; then
            echo "::error::GitHub declined API deployment dispatch (HTTP $status)"
            exit 1
          fi
          echo "Autonomous API deployment requested from new repo. The deployment workflow must finish successfully."
