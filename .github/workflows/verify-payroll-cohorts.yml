name: Verify salary cohort filters and autonomous API (final)
on:
  push:
    branches: [activer-filtres-masse-salariale-20261021]
    paths:
      - '.github/workflows/verify-payroll-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Full automated regression test suite
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Compile production and test sites
        run: |
          npm run build
          test -s docs/index.html
          test -s docs/test/index.html
      - name: Package autonomous Supabase API
        run: sh .github/scripts/package-autonomous-api.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function deployment
        working-directory: supabase/functions/socioscope-api
        run: deno check --config deno.json index.ts
