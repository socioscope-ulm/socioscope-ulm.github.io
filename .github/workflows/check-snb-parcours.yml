name: Verify removal of SNB graph from Parcours
on:
  push:
    branches: [retirer-revalorisation-snb-parcours-20261021]
    paths:
      - '.github/workflows/check-snb-parcours.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test indicator scope and other regressions
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Build production and test interface
        run: |
          npm run build
          test -s docs/index.html
          test -s docs/test/index.html
