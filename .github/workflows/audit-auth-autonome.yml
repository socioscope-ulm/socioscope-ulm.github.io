name: Audit autonome des acces Supabase (lecture seule)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-auth-autonome.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the current Supabase Auth redirect configuration safely
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const expected='https://socioscope-ulm.github.io/';
          const oldDomain='fnme-pointage.github.io';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw Error('Jeton Supabase absent');
          const url='https://api.supabase.com/v1/projects/ovssjbldmsowzojeftyr/config/auth';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+token,'Accept':'application/json'},signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Lecture configuration Auth impossible (HTTP '+r.status+'); aucune modification effectuee.');
          const c=await r.json();
          const siteURL=String(c.site_url||'');
          const redirects=String(c.uri_allow_list||'').split(',').map(x=>x.trim()).filter(Boolean);
          const newSiteDefault=siteURL===expected||siteURL===expected.slice(0,-1);
          const newSiteAllowed=newSiteDefault||redirects.some(x=>x===expected||x===expected.slice(0,-1)||x==='https://socioscope-ulm.github.io/**'||x==='https://socioscope-ulm.github.io/*'||x==='https://socioscope-ulm.github.io');
          const oldDefault=siteURL.includes(oldDomain);
          const oldAllowed=redirects.filter(x=>x.includes(oldDomain)).length;
          const templateNames=['mailer_templates_invite_content','mailer_templates_recovery_content','mailer_templates_confirmation_content'];
          const templateRefs=Object.fromEntries(templateNames.map(k=>[k,typeof c[k]==='string'?{
            oldDomain:c[k].includes(oldDomain),
            redirectTo:c[k].includes('{{ .RedirectTo }}'),
            siteURL:c[k].includes('{{ .SiteURL }}')
          }:null]));
          const result={
            siteURL, newSiteDefault,newSiteAllowed,oldDefault,oldAllowed,
            emailProviderEnabled:c.external_email_enabled===true,
            signupDisabled:c.disable_signup===true,
            confirmationAutoconfirm:c.mailer_autoconfirm===true,
            templates:templateRefs
          };
          console.log(JSON.stringify(result,null,2));
          if(!newSiteDefault||oldDefault)throw Error('La nouvelle adresse doit etre le Site URL principal de Supabase Auth.');
          if(!newSiteAllowed)throw Error('Nouvelle adresse absente de la liste des redirections Auth.');
          if(c.external_email_enabled!==true)throw Error('Authentification par email desactivee !');
          if(c.disable_signup===true)throw Error('Premieres connexions bloquees !');
          const base='https://socioscope-ulm.github.io/';
          const page=await fetch(base,{signal:AbortSignal.timeout(20000)});
          if(page.status!==200||!(await page.text()).includes('id="root"'))throw Error('Nouveau Socioscope non disponible');
          const legacy=await fetch('https://fnme-pointage.github.io/socioscope-ulm/',{signal:AbortSignal.timeout(20000)});
          if(legacy.status!==200)throw Error('Redirection historique indisponible');
          const html=await legacy.text();
          if(!html.includes('window.location.replace(destination.href)')||!html.includes('destination.hash = window.location.hash'))throw Error('Transfert des anciens liens de recuperation non garanti');
          const api='https://ovssjbldmsowzojeftyr.supabase.co/functions/v1/socioscope-api';
          const call=(path,origin)=>fetch(api+path,{headers:{Origin:origin},signal:AbortSignal.timeout(20000)});
          const newSession=await call('/api/session','https://socioscope-ulm.github.io');
          if(newSession.status!==401||newSession.headers.get('access-control-allow-origin')!=='https://socioscope-ulm.github.io')throw Error('Controle de session nouvelle adresse invalide');
          const oldSession=await call('/api/session','https://fnme-pointage.github.io');
          if(oldSession.status!==403)throw Error('Ancienne origine toujours autorisee sur API');
          const unauthMembers=await call('/api/members','https://socioscope-ulm.github.io');
          if(unauthMembers.status!==401)throw Error('Acces membres insuffisamment protege');
          const unauthLink=await call('/api/members/link','https://socioscope-ulm.github.io');
          if(unauthLink.status!==401)throw Error('Liens activation insuffisamment proteges');
          console.log('Nouvelle adresse autorisee pour les invitations et recuperations.');
          NODE
