name: Publish Socioscope ULM (automatic)
# Publish removal of the duplicate M3E averages panel in Familles metiers.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
        with:
          repository: fnme-pointage/socioscope-ulm
          ref: main
          path: source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build for root URL (without modifying original repository)
        working-directory: source
        run: |
          sed -i "s@base:'/socioscope-ulm/'@base:'/'@" scripts/build.mjs
          sed -i "s@/functions/v1/socioscope-api'@/functions/v1/socioscope-bridge'@" src/session.ts
          # Align account toolbar actions on the far right on all screen sizes.
          cat >> src/auth.css <<'CSS'

          .account-bar {
            justify-content: flex-end;
            flex-wrap: wrap;
            height: auto;
            min-height: 44px;
          }
          .account-bar > div {
            margin-left: auto;
            justify-content: flex-end;
            flex-wrap: wrap;
            max-width: 100%;
          }
          .account-bar button {
            white-space: normal;
            text-align: center;
          }
          CSS
          npm install --no-audit --no-fund
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
