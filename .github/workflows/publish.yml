name: Publish Socioscope ULM (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
        with:
          repository: fnme-pointage/socioscope-ulm
          ref: main
          path: source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build for root URL (without modifying original repository)
        working-directory: source
        run: |
          sed -i "s@base:'/socioscope-ulm/'@base:'/'@" scripts/build.mjs
          npm install --no-audit --no-fund
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
