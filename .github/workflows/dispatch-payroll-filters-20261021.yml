name: Release payroll filter API once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-payroll-filters-20261021.yml'
permissions:
  contents: read
  actions: write
jobs:
  release:
    if: github.event.head_commit.message == 'PUBLIER_SERVEUR_FILTRES_MASSE_SALARIALE_20261021'
    runs-on: ubuntu-latest
    steps:
      - name: Start standalone Supabase API deployment after passing regression tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/deploy-supabase.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$status" != "204" ]; then
            echo "::error::API dispatch failed HTTP $status"
            exit 1
          fi
          echo "Autonomous payroll filters deployment requested."
