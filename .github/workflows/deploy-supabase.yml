name: Deploy autonomous Socioscope API (manual and gated)
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/csp.ts'
      - 'src/lib/csp-candidates.ts'
      - 'src/lib/csp-manual-nr.ts'
      - 'src/lib/csp-salary-reference.ts'
      - 'src/lib/csp-alerts.ts'
      - 'src/lib/csp-nr-report.ts'
      - 'src/lib/nr-allocation.ts'
      - 'src/app/api/payroll/import/route.ts'
      - 'src/app/api/payroll/route.ts'
      - 'src/lib/payroll-store.ts'
      - 'src/lib/payroll-reference.ts'
      - 'src/lib/agent-payroll.ts'
      - 'src/lib/bonus-tables.ts'
      - 'server/references.ts'
      - 'server/photos.ts'
      - 'server/guide.ts'
      - 'server/index.ts'
      - 'src/lib/guide-pdf.ts'
      - 'server/photo-catalog.ts'
      - 'src/lib/photo-directory.ts'
      - 'src/lib/photo-match.ts'
      - 'src/lib/rup.ts'
      - 'src/lib/rup-import.js'
      - 'src/lib/rup-calendar.ts'
      - 'src/lib/rup-date-conflicts.ts'
      - 'src/lib/excel-calendar-date.js'
      - 'src/lib/agents-import.ts'
      - 'src/app/api/rup/route.ts'
      - 'src/app/api/agents/route.ts'
      - 'src/lib/agents-store.ts'
      - 'server/result-cache.ts'
      - '.github/scripts/package-autonomous-api.sh'
      - 'scripts/build-server.mjs'
      - 'src/lib/csp-cr-extract.ts'
      - 'src/lib/csp-mutation-arrival.ts'
      - 'src/app/api/csp/route.ts'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socioscope-api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no checkout from the historical repository
        run: |
          ! grep -R -n 'private-data/references/' server src
      - name: Run CSP regression tests before any API deployment
        run: |
          npm install --no-audit --no-fund
          node --experimental-strip-types --test tests/csp.test.ts tests/csp-cr-extract.test.ts tests/csp-mutation-arrival.test.ts tests/csp-manual-nr.test.ts tests/csp-nr-report.test.ts tests/nr-allocation.test.ts tests/bonus-tables.test.ts tests/payroll-filters.test.ts tests/individual-payroll.test.ts tests/individual-bonus-selection.test.ts tests/photo-match.test.ts tests/photo-assignment.test.ts tests/photo-directory.test.ts tests/guide-pdf.test.ts tests/excel-calendar-date.test.ts tests/rup-date-conflicts.test.ts
      - name: Assemble the complete API source and import map
        run: sh .github/scripts/package-autonomous-api.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check bundled independently deployable Edge Function
        working-directory: supabase/functions/socioscope-api
        run: deno check --config deno.json index.ts
      - name: Require an explicitly configured deployment token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure the repository secret SUPABASE_ACCESS_TOKEN before deploying."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Deploy only Socioscope API (never other functions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy socioscope-api --project-ref ovssjbldmsowzojeftyr --no-verify-jwt --use-api
