name: Deploy autonomous Socioscope API (manual and gated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socioscope-api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no checkout from the historical repository
        run: |
          ! grep -R -n 'private-data/references/' server src
      - name: Assemble the complete API source and import map
        run: sh .github/scripts/package-autonomous-api.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check independently deployable Edge Function
        working-directory: supabase/functions/socioscope-api
        run: deno check --config deno.json index.ts
      - name: Require an explicitly configured deployment token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure the repository secret SUPABASE_ACCESS_TOKEN before deploying."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only Socioscope API (never other functions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy socioscope-api --project-ref ovssjbldmsowzojeftyr --no-verify-jwt --use-api
