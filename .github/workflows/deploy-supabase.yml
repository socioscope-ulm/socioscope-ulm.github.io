name: Deploy autonomous Socioscope API (manual, gated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source is independent from the historical repository
        run: |
          if grep -R -n 'private-data/references/' server src; then
            echo "::error::Historical private references still imported"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned application dependencies
        run: npm install --no-audit --no-fund
      - name: Build standalone Supabase server package
        run: |
          node scripts/build-server.mjs
          test -s server-dist/index.ts
          mkdir -p supabase/functions/socioscope-api
          cp server-dist/index.ts supabase/functions/socioscope-api/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Socioscope API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret in the new repository"
            exit 1
          fi
          supabase functions deploy socioscope-api --project-ref ovssjbldmsowzojeftyr --no-verify-jwt
