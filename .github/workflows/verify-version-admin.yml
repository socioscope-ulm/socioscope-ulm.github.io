name: Verify live server version display
on:
  push:
    branches: [affichage-version-serveur-admin-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version parser and isolation by role
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Build production and test frontends
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s docs/index.html
          test -s docs/test/index.html
      - name: Package new API from autonomous repository
        run: sh .github/scripts/package-autonomous-api.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check new API deployable package
        working-directory: supabase/functions/socioscope-api
        run: deno check --config deno.json index.ts
