name: Deploy autonomous Socioscope ULM
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'scripts/build.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: socioscope-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/csp-beneficiary-advancements.test.ts tests/csp-coverage-recovery.test.ts tests/csp-retrospective-reference.test.ts tests/csp-document-type.test.ts tests/csp.test.ts tests/csp-cr-extract.test.ts tests/csp-mutation-arrival.test.ts tests/csp-manual-nr.test.ts
      - run: node --experimental-strip-types --test tests/csp-quarterly-report.test.ts tests/csp-quarterly-columns.test.ts
      - run: node --experimental-strip-types --test tests/insee-annual.test.ts tests/salary-comparison.test.ts
      - run: python3 -m unittest discover -s tests -p test_insee_sync.py
      - run: node --experimental-strip-types --test tests/bonus-tables.test.ts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
