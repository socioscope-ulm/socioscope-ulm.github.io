name: Deploy nouveau Socioscope ULM
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fnme-pointage/socioscope-ulm
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build pour la racine du nouveau domaine
        run: |
          node -e "const fs=require('fs'); const p='scripts/build.mjs'; let s=fs.readFileSync(p,'utf8'); if(!s.includes("base:'/socioscope-ulm/'")) throw Error('Base inattendue'); fs.writeFileSync(p,s.replace("base:'/socioscope-ulm/'","base:'/'"));"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
