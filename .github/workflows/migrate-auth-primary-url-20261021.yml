name: Move Auth primary URL to independent Socioscope
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-auth-primary-url-20261021.yml'
permissions:
  contents: read
jobs:
  migrate-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Safely update only Supabase Auth Site URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw Error('Supabase access token is not configured');
          const root='https://api.supabase.com/v1/projects/ovssjbldmsowzojeftyr/config/auth';
          const expected='https://socioscope-ulm.github.io/';
          const previous='https://fnme-pointage.github.io/socioscope-ulm/';
          const req=async(method,body)=>{
            const r=await fetch(root,{method,headers:{
              Authorization:'Bearer '+token,Accept:'application/json',
              ...(body?{'Content-Type':'application/json'}:{})
            },...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(25000)});
            if(!r.ok)throw Error('Auth config '+method+' failed HTTP '+r.status+' (no secrets disclosed)');
            return r.json();
          };
          const before=await req('GET');
          const primary=String(before.site_url||'');
          const allowed=String(before.uri_allow_list||'').split(',').map(x=>x.trim()).filter(Boolean);
          const newAllowed=allowed.some(x=>[expected,expected.slice(0,-1),'https://socioscope-ulm.github.io/**','https://socioscope-ulm.github.io/*'].includes(x));
          if(primary!==expected&&primary!==previous)throw Error('Unexpected current Supabase Site URL, refusing to modify: '+primary);
          if(!newAllowed&&primary!==expected)throw Error('New Socioscope is not an allowed redirect yet.');
          if(primary===previous){
            console.log('Moving Auth Site URL from old GitHub Pages to the standalone Socioscope.');
            await req('PATCH',{site_url:expected});
          }
          const after=await req('GET');
          if(after.site_url!==expected)throw Error('Supabase Site URL did not change; no changes made to other fields.');
          if(after.uri_allow_list!==before.uri_allow_list)throw Error('Allowed redirect list changed unexpectedly');
          for(const key of ['external_email_enabled','disable_signup','mailer_autoconfirm']){
            if(after[key]!==before[key])throw Error('Authentication setting changed unexpectedly: '+key);
          }
          console.log('Verified primary Auth URL: '+after.site_url);
          console.log('Existing legacy recovery redirect retained for previously issued links: '+allowed.some(x=>x.includes('fnme-pointage.github.io')));
          console.log('Email provider, registration settings and redirect allow-list left untouched.');
          NODE
