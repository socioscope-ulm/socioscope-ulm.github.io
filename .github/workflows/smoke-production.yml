name: Socioscope production smoke checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public site and API protection without credentials
        run: |
          node --input-type=module <<'NODE'
          const origin='https://socioscope-ulm.github.io';
          const old='https://fnme-pointage.github.io';
          const api='https://ovssjbldmsowzojeftyr.supabase.co/functions/v1/socioscope-api';
          async function call(url,options={}) {
            const response=await fetch(url,{...options,signal:AbortSignal.timeout(18000)});
            return response;
          }
          const page=await call(origin+'/');
          if(page.status!==200)throw Error('Nouvelle adresse inaccessible: '+page.status);
          const html=await page.text();
          if(!html.includes('id="root"'))throw Error('Interface HTML attendue absente');
          const preflight=await call(api+'/api/agents',{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':'POST'}});
          if(preflight.status!==204)throw Error('New origin preflight incorrect: '+preflight.status);
          if(preflight.headers.get('access-control-allow-origin')!==origin)throw Error('New CORS origin incorrect');
          const noauth=await call(api+'/api/session',{headers:{Origin:origin}});
          if(noauth.status!==401)throw Error('Session without authentication should return 401, received '+noauth.status);
          const oldSession=await call(api+'/api/session',{headers:{Origin:old}});
          if(![401,403].includes(oldSession.status))throw Error('Unexpected transitional old origin status '+oldSession.status);
          if(oldSession.status===401&&oldSession.headers.get('access-control-allow-origin')!==old)throw Error('Old origin CORS incorrect before retirement');
          if(oldSession.status===403&&oldSession.headers.get('access-control-allow-origin')===old)throw Error('Old origin CORS unexpectedly allowed after retirement');
          const rejected=await call(api+'/api/session',{headers:{Origin:'https://example.org'}});
          if(rejected.status!==403)throw Error('Origine inconnue devrait etre rejetee, reçu '+rejected.status);
          console.log('Smoke OK: Pages root, new allowed origin, legacy compatibility or retirement, 401 auth gate, 403 unknown origin');
          NODE
