name: Build and publish Socioscope ULM
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'test/**'
      - 'public/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: socioscope-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run CSP quarterly report tests
        run: node --experimental-strip-types --test tests/csp-quarterly-report.test.ts
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
