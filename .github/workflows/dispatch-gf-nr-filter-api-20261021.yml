name: One-time release GF NR filtered server
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-gf-nr-filter-api-20261021.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.event.head_commit.message == 'DEPLOYER_API_GF_NR_FILTRES_20261021'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tested autonomous Supabase deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          response=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/deploy-supabase.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$response" != "204" ]; then
            echo "::error::Deployment dispatch failed HTTP $response"
            exit 1
          fi
          echo "Requested standalone API release of sex and college filtered agent averages."
