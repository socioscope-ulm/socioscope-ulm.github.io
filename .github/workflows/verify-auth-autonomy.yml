name: Verify independent authentication and retire legacy API safely
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test account access, recovery, invitations and calculations
        run: |
          npm install --no-audit --no-fund
          node --experimental-strip-types --test tests/*.test.ts
      - name: Build production and simulation sites
        run: |
          npm run build
          test -s docs/index.html
          test -s docs/test/index.html
      - name: Assemble autonomous Supabase API
        run: sh .github/scripts/package-autonomous-api.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify complete Edge Function imports
        working-directory: supabase/functions/socioscope-api
        run: deno check --config deno.json index.ts
