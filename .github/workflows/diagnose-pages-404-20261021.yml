name: Diagnose Socioscope public 404
on:
  push:
    branches: [corriger-version-et-graphiques-parcours-20261021]
    paths:
      - '.github/workflows/diagnose-pages-404-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect actual Pages configuration and live HTTP responses
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://socioscope-ulm.github.io/',
            'https://socioscope-ulm.github.io/test/',
            'https://fnme-pointage.github.io/socioscope-ulm/',
            'https://ovssjbldmsowzojeftyr.supabase.co/functions/v1/socioscope-api/api/session'
          ];
          for(const target of urls){
            try{
              const r=await fetch(target,{redirect:'manual',headers:{'Cache-Control':'no-cache','User-Agent':'Socioscope-pages-diagnostic/1.0'},signal:AbortSignal.timeout(20000)});
              const body=await r.text();
              console.log('LIVE',JSON.stringify({url:target,status:r.status,location:r.headers.get('location'),contentType:r.headers.get('content-type'),length:body.length,title:body.match(/<title>([^<]*)<\/title>/i)?.[1]||'',hasRoot:body.includes('id="root"'),github404:body.includes('There isn\'t a GitHub Pages site here.')}));
            }catch(e){console.log('LIVE ERROR',target,String(e.message));}
          }
          const gh=await fetch('https://api.github.com/repos/'+process.env.GH_REPO+'/pages',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(20000)});
          console.log('PAGES API HTTP',gh.status);
          const pages=await gh.json();
          if(gh.ok)console.log('PAGES SETTINGS',JSON.stringify({url:pages.html_url,status:pages.status,source:pages.source,build_type:pages.build_type,https_enforced:pages.https_enforced,custom_domain:pages.cname,public:pages.public}));
          else console.log('PAGES SETTINGS ERROR',{message:pages.message});
          NODE
