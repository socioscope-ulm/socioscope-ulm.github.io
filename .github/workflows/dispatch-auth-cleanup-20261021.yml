name: One-time autonomous CORS retirement deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-auth-cleanup-20261021.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.event.head_commit.message == 'DEPLOYER_SUPABASE_API_AUTONOME_SANS_ANCIENNE_ORIGINE_20261021'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing manual and gated API deployment from autonomous repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/deploy-supabase.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$status" != "204" ]; then
            echo "::error::GitHub refused release dispatch HTTP $status"
            exit 1
          fi
          echo 'Autonomous Socioscope API deployment triggered; verification required before legacy removal.'
