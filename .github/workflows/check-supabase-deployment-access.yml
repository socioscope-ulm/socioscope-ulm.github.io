name: Verify Supabase deployment authorization (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-supabase-deployment-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check new repository can reach the current Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le nouveau depot ne dispose pas encore du secret SUPABASE_ACCESS_TOKEN. Aucune modification effectuee."
            exit 1
          fi
          supabase functions list --project-ref ovssjbldmsowzojeftyr > /dev/null
          echo "Acces deploiement Supabase verifie en lecture seule. Aucune modification effectuee."
